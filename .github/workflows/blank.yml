name: Paper intraday bot

on:
  schedule:
    # UTC window covers US market hours across daylight-saving changes.
    # The bot checks Alpaca market clock and New York entry/exit times.
    - cron: '*/5 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpaca-paper-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check Python syntax
        run: python -m py_compile bot.py report.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run paper bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_ONLY: 'true'
        run: python bot.py
      - name: Generate report
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_ONLY: 'true'
        run: python report.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-report-${{ github.run_id }}
          path: report.csv
          if-no-files-found: warn
          retention-days: 30
