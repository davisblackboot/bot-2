name: Alpaca $100 paper strategy
on:
  schedule:
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpaca-100-paper
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Trade (paper only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py
